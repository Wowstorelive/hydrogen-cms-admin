apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-admin-dashboard
  namespace: production
  labels:
    app: cms-admin-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cms-admin-dashboard
  template:
    metadata:
      labels:
        app: cms-admin-dashboard
    spec:
      containers:
      - name: cms-admin
        image: gcr.io/wowstore-ai-media-agent/cms-admin-dashboard:latest
        imagePullPolicy: Always
        env:
        - name: N8N_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-api-key
              key: api-key
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: github-app-credentials
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: github-app-credentials
              key: client-secret
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: github-app-credentials
              key: app-id
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cms-admin-dashboard
  namespace: production
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: cms-admin-dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cms-admin-dashboard
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - cms.wowstore.live
    secretName: cms-admin-tls
  rules:
  - host: cms.wowstore.live
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cms-admin-dashboard
            port:
              number: 80
